<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar testimonios | Suprema de Pollo</title><style>body{font:16px system-ui;background:#fff7ec;color:#333;margin:0;padding:24px}main{max-width:800px;margin:auto}h1{color:#a43c0d}form,article{background:white;border-radius:14px;padding:22px;margin:16px 0}label,input,select{display:block;margin:10px 0}input{padding:12px;width:95%}button{background:#e94a0d;color:white;border:0;border-radius:8px;padding:12px;margin:6px;cursor:pointer}.oculto{display:none}.estrellas{color:#c98300}</style></head><body><main><a href="index.html">← Volver a la tienda</a><h1>Administrar testimonios</h1><form id="login"><h2>Acceso privado</h2><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button>Ingresar</button></form><section id="panel" class="oculto"><button id="salir">Cerrar sesión</button><label>Estado <select id="filtro"><option value="pendiente">Pendientes</option><option value="aprobado">Aprobados</option><option value="rechazado">Rechazados</option></select></label><div id="lista"></div></section><p id="mensaje" role="status"></p></main><script>
const base="https://wumrhtyztpircywntcdw.supabase.co",key="sb_publishable_JqC21O-PYQDhTFdMBcXK0Q_TBGibGjj";
let token=sessionStorage.getItem("suprema-token")||"";
const $=id=>document.getElementById(id), headers=()=>({apikey:key,Authorization:"Bearer "+token,"Content-Type":"application/json"});
async function comprobar(){const r=await fetch(base+"/rest/v1/administradores?select=user_id&limit=1",{headers:headers()});if(!r.ok||(await r.json()).length===0)throw Error("No tenés permiso de administrador");}
async function entrar(){await comprobar();$("login").classList.add("oculto");$("panel").classList.remove("oculto");$("mensaje").textContent="";await cargar();}
$("login").addEventListener("submit",async e=>{e.preventDefault();$("mensaje").textContent="Verificando...";try{const r=await fetch(base+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});if(!r.ok)throw Error("Credenciales incorrectas");token=(await r.json()).access_token;await entrar();sessionStorage.setItem("suprema-token",token);$("password").value="";}catch(e){token="";$("mensaje").textContent=e.message;}});
async function cargar(){const lista=$("lista");lista.textContent="Cargando...";try{const r=await fetch(base+"/rest/v1/testimonios?select=id,nombre,estrellas,descripcion,estado,creado_en&estado=eq."+$("filtro").value+"&order=creado_en.desc",{headers:headers()});if(!r.ok)throw Error("No se pudieron cargar los testimonios");const datos=await r.json();lista.replaceChildren();if(!datos.length)lista.textContent="No hay testimonios en esta categoría.";datos.forEach(t=>{const card=document.createElement("article");const h=document.createElement("h3");h.textContent=t.nombre;const stars=document.createElement("p");stars.className="estrellas";stars.textContent="★".repeat(t.estrellas)+"☆".repeat(5-t.estrellas);const p=document.createElement("p");p.textContent=t.descripcion;card.append(h,stars,p);for(const [estado,label] of [["aprobado","Aprobar"],["rechazado","Rechazar"],["pendiente","Dejar pendiente"]]){if(t.estado===estado)continue;const b=document.createElement("button");b.textContent=label;b.onclick=()=>cambiar(t.id,estado);card.append(b);}lista.append(card);});}catch(e){lista.textContent=e.message;}}
async function cambiar(id,estado){$("mensaje").textContent="Guardando...";try{const r=await fetch(base+"/rest/v1/testimonios?id=eq."+id,{method:"PATCH",headers:headers(),body:JSON.stringify({estado})});if(!r.ok)throw Error("No se pudo cambiar el estado");$("mensaje").textContent="Estado actualizado.";await cargar();}catch(e){$("mensaje").textContent=e.message;}}
$("filtro").onchange=cargar;$("salir").onclick=()=>{token="";sessionStorage.removeItem("suprema-token");$("panel").classList.add("oculto");$("login").classList.remove("oculto");};if(token)entrar().catch(()=>{token="";sessionStorage.removeItem("suprema-token");$("mensaje").textContent="Ingresá nuevamente.";});
</script></body></html>
